<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    h1{
      background-color: lightcyan;
      height: 300px;
      width: 300px; 
      
      border: 10px solid blue;
      margin: 10px auto 10px auto;
      outline: 10px dashed yellow;
      padding: 10px

    }
    a{
      border-width: 2px;
      border-style: solid;
      border-color: chocolate;
    }
  </style>
  <title>modelos de caixas</title>
</head>
<body>
  <h1>Exemplo de caixa box-level</h1>
  <p>Paragrafos tambem são exemplo de box-level, mas os <a href="#">links são exemplos de inline-level</a></p>
</body>
</html>
