<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alinhamento vertical</title>
  <style>
    #container{
      background-size: 100% 100%;
      background-image: url('imagens/target001.png');
      position: relative;
      height: 94vh;
      background-color: purple;
      padding: 10px;
    }
    article.conteudo{
      background-image: url('imagens/target001.png');
      background-size: 100% 100%;
      position: absolute;
      width: 400px;
      height: 200px;
      background-color: yellow;

      left: 70%;
      top: 70%;

      transform: translate(-50%, -50%);
    }
    #conteudo2{
      left: 30%;
      top: 30%;
    }
  </style>
</head>
<body>
  <section id="container">
    <article class="conteudo" id="conteudo1">

    </article>
    <article class="conteudo" id="conteudo2">

    </article>
  </section>
</body>
</html>
